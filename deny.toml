[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Maintenance-only notice in Alloy's current dependency graph; no patched release.
# No vulnerability advisories are ignored.
ignore = ["RUSTSEC-2024-0436"] # paste

[bans]
multiple-versions = "warn"
wildcards = "allow" # workspace path deps have no version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
