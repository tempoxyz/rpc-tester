[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Maintenance-only notice in Alloy's current dependency graph; no patched release.
    "RUSTSEC-2024-0436", # paste
    # crypto-bigint 0.5 timing variability, pulled in by alloy via k256 0.13 /
    # elliptic-curve; no patched 0.5 release. rpc-tester never signs or handles
    # secret keys, so the side channel is not reachable. Drop once alloy moves off k256 0.13.
    "RUSTSEC-2026-0387",
]

[bans]
multiple-versions = "warn"
wildcards = "allow" # workspace path deps have no version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
