name: test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, id-token: write}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@6f436eb3a168279692739e8c0c9fdb52b94bfae7
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          cache-on-failure: true
      # Installs anvil, used by the same-node self-test.
      - uses: tempoxyz/gh-actions/actions/setup-foundry@487be2d19b0ba9ae1903143016444ab752c3e939
      - run: cargo test --workspace --all-features --locked
