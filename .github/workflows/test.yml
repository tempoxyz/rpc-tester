name: test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, id-token: write}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5840979a7c849cbe541c67431ec7315cd6396e3b # 2026-09-25T08-14-04Z-5840979a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@5840979a7c849cbe541c67431ec7315cd6396e3b # 2026-09-25T08-14-04Z-5840979a
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@5840979a7c849cbe541c67431ec7315cd6396e3b # 2026-09-25T08-14-04Z-5840979a
        with:
          cache-on-failure: true
      # Installs anvil, used by the same-node self-test.
      - uses: tempoxyz/gh-actions/actions/setup-foundry@5840979a7c849cbe541c67431ec7315cd6396e3b # 2026-09-25T08-14-04Z-5840979a
      - run: cargo test --workspace --all-features --locked
