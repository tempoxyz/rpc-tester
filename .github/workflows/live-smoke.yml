name: live-smoke

# Smoke test against a live endpoint used as both rpc1 and rpc2: comparing a node against itself
# should succeed, so a failure usually indicates a bug in the tester or an endpoint outage. Note
# that a load-balanced endpoint can route the two clients to backends at slightly different
# heights, so near-tip flakes are possible; persistent failures are the signal.

on:
  workflow_dispatch:
    inputs:
      rpc:
        description: RPC endpoint to smoke test (used as both rpc1 and rpc2)
        required: false
        default: https://ethereum.reth.rs/rpc
  schedule:
    # Weekly on Monday morning.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  same-node:
    name: same-node smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, id-token: write}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
        with:
          cache-on-failure: true
      - name: Run tester against a single live node
        env:
          RPC: ${{ inputs.rpc || 'https://ethereum.reth.rs/rpc' }}
        run: >
          cargo run --release -p rpc-tester-cli --
          --rpc1 "$RPC"
          --rpc2 "$RPC"
          --num-blocks 3
          --rate-limit 10
